<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bathroom renovation, 3D concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe8f3; --panel:rgba(255,255,255,.93); --ink:#14224a; --muted:#4a5878;
  --line:#c3cfe4; --cobalt:#1f3c94; --on-cobalt:#ffffff; --lemon:#f2c230;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1730; --panel:rgba(18,28,56,.93); --ink:#eef2fb; --muted:#a9b6d4;
    --line:#2f3f6b; --cobalt:#8fb0ff; --on-cobalt:#0e1730;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1730; --panel:rgba(18,28,56,.93); --ink:#eef2fb; --muted:#a9b6d4;
  --line:#2f3f6b; --cobalt:#8fb0ff; --on-cobalt:#0e1730;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; overflow:hidden}
#scene{position:fixed; inset:0}
#scene canvas{display:block; width:100%; height:100%; touch-action:none}
.panel{position:fixed; left:16px; top:calc(16px + env(safe-area-inset-top,0px));
  width:340px; max-width:calc(100% - 32px); background:var(--panel);
  border:1px solid var(--line); border-radius:14px; padding:16px 18px 18px;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
h1{font-family:'Young Serif',Georgia,'Times New Roman',serif; font-weight:400;
  font-size:1.55rem; line-height:1.15; margin:0 0 8px; color:var(--cobalt)}
.panel p{margin:0 0 14px; color:var(--muted); font-size:.9rem; line-height:1.5}
.views{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.views button{font:inherit; font-size:.78rem; line-height:1.15; min-height:46px;
  padding:4px; border-radius:3px; border:1.5px solid var(--cobalt);
  background:transparent; color:var(--ink); cursor:pointer}
.layout{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px}
.layout button{font:inherit; font-size:.82rem; font-weight:600; line-height:1.2; padding:7px 6px; border-radius:3px;
  border:1.5px solid var(--cobalt); background:transparent; color:var(--ink); cursor:pointer; text-align:center}
.layout button small{display:block; font-weight:400; font-size:.72rem; color:inherit; opacity:.8; margin-top:2px}
.layout.ceil{grid-template-columns:6.6em 1fr 1fr; align-items:center; margin-top:-4px}
.layout.tiling{margin-top:0}
.layout.ceil.arch{margin-top:0; grid-template-columns:4.4em 1fr 1fr; gap:4px}
.layout button:disabled{opacity:.35; cursor:default}
.layout.ceil.tiling{grid-template-columns:4.4em repeat(4,minmax(0,1fr)); gap:4px}
.layout.ceil.tiling button{font-size:.74rem; padding:5px 2px; white-space:nowrap}
.layout.ceil.vcol{grid-template-columns:4.4em repeat(4,minmax(0,1fr)); gap:4px; margin-top:0}
.layout.ceil.vcol button{padding:5px 1px; font-size:.72rem; display:flex; align-items:center; justify-content:center; gap:4px}
.layout.ceil.vcol button i{width:10px; height:10px; border-radius:50%; border:1px solid var(--line); flex:none}
.layout.ceil .lbl{min-width:4.4em; font-size:.8rem; color:var(--muted); padding-right:4px}
.layout.ceil button{padding:5px 6px; font-weight:400}
.layout button[aria-pressed="true"]{background:var(--cobalt); color:var(--on-cobalt)}
.views button[aria-pressed="true"]{background:var(--cobalt); color:var(--on-cobalt)}
button:focus-visible, summary:focus-visible{outline:3px solid var(--lemon); outline-offset:2px}
.legend{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:320px; max-width:calc(100% - 32px); max-height:60vh; overflow:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:12px 16px; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
.legend summary{cursor:pointer; font-family:'Young Serif',Georgia,serif; font-size:1.05rem; color:var(--cobalt)}
.mat{display:grid; grid-template-columns:46px 1fr; gap:12px; align-items:center; margin-top:12px}
.mat img{width:46px; height:46px; border-radius:3px; display:block; border:1px solid var(--line)}
.mat b{display:block; font-weight:600; font-size:.88rem; margin-bottom:2px}
.mat span{font-size:.8rem; color:var(--muted); line-height:1.4}
#err{position:fixed; inset:0; display:none; place-items:center; padding:24px; text-align:center; color:var(--ink)}
@media (max-width:640px){
  .panel{left:10px; right:10px; width:auto; max-width:none; padding:12px 14px 14px}
  h1{font-size:1.2rem}
  .panel p{font-size:.82rem; margin-bottom:10px}
  .legend{left:10px; right:10px; width:auto; max-width:none; max-height:45vh}
}


/* ==========================================================
   MOBILE-FIRST INTERACTION LAYER
   Keeps the 3D canvas full-screen and turns the configurator
   into a bottom sheet on phones. Desktop keeps the original UI.
   ========================================================== */
html,body{width:100%;min-height:100%;overscroll-behavior:none}
#scene{width:100vw;height:100dvh;min-height:100svh}
.panel,.legend,.mobile-viewbar{z-index:10}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.panel-title-wrap{min-width:0}
.panel-body{margin-top:10px}
.sheet-toggle{display:none;border:0;background:transparent;color:var(--cobalt);font:inherit;font-weight:600;cursor:pointer}
.mobile-viewbar{display:none}
button{-webkit-tap-highlight-color:transparent}

@media (max-width:700px){
  body{height:100dvh;min-height:100svh;overflow:hidden}
  #scene{inset:0;height:100dvh}

  /* Camera shortcuts remain available even when the options sheet is closed. */
  .mobile-viewbar{
    display:flex;position:fixed;
    top:calc(10px + env(safe-area-inset-top,0px));
    left:calc(10px + env(safe-area-inset-left,0px));
    right:calc(10px + env(safe-area-inset-right,0px));
    gap:7px;padding:7px;
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:0 6px 24px rgba(20,34,74,.10);
    transition:opacity .18s ease,transform .18s ease;
  }
  .mobile-viewbar::-webkit-scrollbar{display:none}
  .mobile-viewbar button{
    flex:0 0 auto;min-height:42px;padding:0 13px;
    border:1.5px solid var(--cobalt);border-radius:11px;
    background:transparent;color:var(--ink);font:inherit;font-size:.78rem;
    white-space:nowrap;touch-action:manipulation;
  }
  .mobile-viewbar button[aria-pressed="true"]{background:var(--cobalt);color:var(--on-cobalt)}

  /* Bottom sheet */
  .panel{
    left:calc(10px + env(safe-area-inset-left,0px));
    right:calc(10px + env(safe-area-inset-right,0px));
    top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));
    width:auto;max-width:none;
    padding:0;border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 36px rgba(20,34,74,.18);
    transition:max-height .22s ease,transform .22s ease;
  }
  .panel-head{align-items:center;padding:11px 12px 11px 14px;min-height:58px}
  .panel-title-wrap{display:flex;align-items:center;gap:9px;min-width:0}
  .panel h1{font-size:1.02rem;line-height:1.15;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel p{display:none}
  .sheet-toggle{
    display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
    min-height:38px;padding:0 11px;
    border:1.5px solid var(--cobalt);border-radius:11px;
    background:transparent;color:var(--ink);font-size:.78rem;
    touch-action:manipulation;
  }
  .sheet-toggle .chevron{display:inline-block;font-size:1rem;transition:transform .2s ease}
  .panel[data-open="true"] .sheet-toggle .chevron{transform:rotate(180deg)}
  .panel[data-open="false"] .panel-body{display:none}
  .panel[data-open="true"]{max-height:min(72dvh,620px)}
  .panel[data-open="true"] .panel-body{
    display:block;margin:0;padding:4px 14px 16px;
    max-height:calc(min(72dvh,620px) - 58px);
    overflow-y:auto;overflow-x:hidden;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  }
  #controlsPanel[data-open="true"] ~ .mobile-viewbar{opacity:0;pointer-events:none;transform:translateY(-8px)}

  /* Touch targets and 2-column control groups. */
  .layout,
  .layout.ceil,
  .layout.ceil.arch,
  .layout.ceil.tiling,
  .layout.ceil.vcol{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;margin:0 0 12px;
  }
  .layout.ceil .lbl{
    grid-column:1/-1;min-width:0;padding:4px 2px 0;
    font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  }
  .layout button,
  .layout.ceil button,
  .layout.ceil.tiling button,
  .layout.ceil.vcol button{
    min-height:46px;padding:7px 8px;border-radius:11px;font-size:.8rem;
    touch-action:manipulation;
  }
  .layout button small{font-size:.68rem;margin-top:3px}
  .views{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .views button{min-height:46px;border-radius:11px;font-size:.78rem;touch-action:manipulation}

  /* Materials becomes a compact card below the camera bar. */
  .legend{
    left:auto;right:calc(10px + env(safe-area-inset-right,0px));
    top:calc(69px + env(safe-area-inset-top,0px));bottom:auto;
    width:auto;max-width:calc(100vw - 20px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
    max-height:52dvh;padding:9px 12px;border-radius:13px;
    box-shadow:0 6px 24px rgba(20,34,74,.10);
  }
  .legend[open]{width:min(360px,calc(100vw - 20px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)))}
  .legend summary{font-size:.88rem;line-height:1.2;touch-action:manipulation}
  .mat{grid-template-columns:42px 1fr;gap:10px;margin-top:10px}
  .mat img{width:42px;height:42px}
  .mat b{font-size:.82rem}.mat span{font-size:.74rem}
}

@media (max-width:380px){
  .mobile-viewbar button{padding:0 10px;font-size:.74rem}
  .panel h1{font-size:.94rem}
  .sheet-toggle{padding:0 9px}
}

@media (orientation:landscape) and (max-height:520px){
  .panel[data-open="true"]{max-height:84dvh}
  .panel[data-open="true"] .panel-body{max-height:calc(84dvh - 56px)}
  .mobile-viewbar{left:calc(58px + env(safe-area-inset-left,0px));right:calc(58px + env(safe-area-inset-right,0px))}
  .legend{top:calc(65px + env(safe-area-inset-top,0px));max-height:55dvh}
}

</style>
</head>
<body>
<div id="scene" aria-label="3D model of the bathroom concept"></div>

<section class="panel" id="controlsPanel" data-open="false">
  <div class="panel-head">
    <div class="panel-title-wrap">
      <h1>Bathroom renovation</h1>
      <p>Drag to look around, pinch or scroll to zoom.</p>
    </div>
    <button class="sheet-toggle" id="controlsToggle" type="button" aria-expanded="false" aria-controls="controlsBody">
      <span>Options</span><span class="chevron" aria-hidden="true">⌃</span>
    </button>
  </div>
  <div class="panel-body" id="controlsBody">
  <div class="layout" role="group" aria-label="Layout option">
    <button data-layout="bidet" aria-pressed="true">WC + bidet<small>78 cm shower, 82 cm vanity</small></button>
    <button data-layout="nobidet" aria-pressed="false">No bidet<small>80 cm shower, 120 cm vanity</small></button>
  </div>
  <div class="layout ceil" role="group" aria-label="Shower ceiling colour">
    <span class="lbl">Shower ceiling</span>
    <button data-ceil="pale" aria-pressed="true">Pale</button>
    <button data-ceil="navy" aria-pressed="false">Navy</button>
  </div>
  <div class="layout ceil vcol" role="group" aria-label="Shower tiling">
    <span class="lbl">Shower</span>
    <button data-sh="navy" aria-pressed="true" title="Navy 7.5 × 30 with the maiolica arch">Navy</button>
    <button data-sh="maiolica" aria-pressed="false" title="White tiles with a maiolica feature wall, no arch">Maiolica</button>
    <button data-sh="terrazzo" aria-pressed="false" title="Terrazzo with blue chips, no arch">Terrazzo</button>
    <button data-sh="mosaic" aria-pressed="false" title="Blue and white mosaic with the maiolica arch">Mosaic</button>
  </div>
  <div class="layout ceil arch" role="group" aria-label="Lining of the arched window niche in the shower">
    <span class="lbl">Arch</span>
    <button data-af="maiolica" aria-pressed="true">Maiolica</button>
    <button data-af="terrazzo" aria-pressed="false">Terrazzo</button>
  </div>
  <div class="layout ceil tiling" role="group" aria-label="WC and bidet wall tiling">
    <span class="lbl">WC wall</span>
    <button data-wt="checker" aria-pressed="true" title="Cream and blue checkerboard">Checker</button>
    <button data-wt="white" aria-pressed="false" title="White 7.5 × 30 vertical">White</button>
    <button data-wt="terrazzo" aria-pressed="false" title="Terrazzo with blue chips">Terrazzo</button>
    <button data-wt="none" aria-pressed="false" title="No tiles: the WC/bidet wall painted like the walls">None</button>
  </div>
  <div class="layout ceil vcol" role="group" aria-label="Radiator colour">
    <span class="lbl">Radiator</span>
    <button data-rc="white" aria-pressed="false"><i style="background:#f6f6f4"></i>White</button>
    <button data-rc="cream" aria-pressed="true"><i style="background:#efe7d4"></i>Cream</button>
    <button data-rc="navy" aria-pressed="false"><i style="background:#2b3a6b"></i>Navy</button>
    <button data-rc="turq" aria-pressed="false"><i style="background:#3aa6a0"></i>Turq.</button>
  </div>
  <div class="layout ceil vcol" role="group" aria-label="Vanity cabinet colour">
    <span class="lbl">Vanity</span>
    <button data-vcol="navy" aria-pressed="true"><i style="background:#2b3a6b"></i>Navy</button>
    <button data-vcol="turq" aria-pressed="false"><i style="background:#3aa6a0"></i>Turq.</button>
    <button data-vcol="chalk" aria-pressed="false"><i style="background:#ece6da"></i>White</button>
    <button data-vcol="oak" aria-pressed="false"><i style="background:#8b5e37"></i>Oak</button>
  </div>
  <div class="layout ceil vcol" role="group" aria-label="Colour of the niches above the WC and bidet">
    <span class="lbl">Niches</span>
    <button data-ncol="oak" aria-pressed="true"><i style="background:#8b5e37"></i>Oak</button>
    <button data-ncol="navy" aria-pressed="false"><i style="background:#2b3a6b"></i>Navy</button>
    <button data-ncol="turq" aria-pressed="false"><i style="background:#3aa6a0"></i>Turq.</button>
    <button data-ncol="white" aria-pressed="false"><i style="background:#f4efe6"></i>White</button>
  </div>
  <div class="views" role="group" aria-label="Camera views">
    <button data-view="overview" aria-pressed="true">Overview</button>
    <button data-view="door" aria-pressed="false">From the door</button>
    <button data-view="shower" aria-pressed="false">Shower</button>
    <button data-view="storage" aria-pressed="false">Vanity</button>
    <button data-view="wc" aria-pressed="false" id="wcBtn">WC &amp; bidet</button>
    <button data-view="corner" aria-pressed="false">Window corner</button>
    <button data-view="seat" aria-pressed="false">Shower seat</button>
    <button data-view="plan" aria-pressed="false">Plan</button>
  </div>
  </div>
</section>

<nav class="mobile-viewbar views" aria-label="Quick camera views">
  <button data-view="overview" aria-pressed="true">Overview</button>
  <button data-view="door" aria-pressed="false">Door</button>
  <button data-view="shower" aria-pressed="false">Shower</button>
  <button data-view="storage" aria-pressed="false">Vanity</button>
  <button data-view="wc" aria-pressed="false">WC</button>
  <button data-view="corner" aria-pressed="false">Corner</button>
  <button data-view="seat" aria-pressed="false">Seat</button>
  <button data-view="plan" aria-pressed="false">Plan</button>
</nav>

<details class="legend" id="legend">
  <summary>Materials</summary>
  <div id="mats"></div>
</details>

<div id="err">The 3D view could not start. Open this page in a recent browser with WebGL enabled.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
if(!window.THREE || !THREE.OrbitControls){document.getElementById('err').style.display='grid';return;}

/* ---------- room geometry (metres) ---------- */
const H=2.90, LEN=3.2, W0=1.75, W1=1.45;
const wallZ=x=>W0-(W0-W1)*x/LEN;
const SEAT_X=.39,SEAT_FRONT=wallZ(.39)-.30;  // seat front edge, straight and parallel to the door wall
let SHOWER=0.86; const VL=0.08, FS=1.562, FW_FACE=1.41, FW_END=1.56, FW_H=1.2;

/* ---------- renderer ---------- */
const host=document.getElementById('scene');
let renderer;
try{ renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); }
catch(e){ document.getElementById('err').style.display='grid'; return; }
const IS_COARSE=window.matchMedia('(pointer:coarse)').matches;
const MOBILE_MQ=window.matchMedia('(max-width:700px)');
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,MOBILE_MQ.matches?1.5:2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.NoToneMapping; // true tile colours, no filmic wash-out
renderer.shadowMap.enabled=false; // flat, even lighting: no cast shadows
host.appendChild(renderer.domElement);
const world=new THREE.Scene();
let scene=null,doorG=null,ceilG=null,showerCeil=null,ceilMode='pale',SH='navy',WT='checker',AF='maiolica'; // AF: lining of the arch (maiolica or terrazzo), when the shower has one
// // tiling chosen separately for the shower (SH) and for the WC/bidet wall (WT)
// shower ceiling: pale limewash like the rest of the room, or a deep navy matt paint (moisture-resistant) close to the shower tiles
const ceilNavy=new THREE.MeshStandardMaterial({color:'#0f1c4b',roughness:.9});
const ceilMat=()=>ceilMode==='navy'?ceilNavy:M.plaster;
const camera=new THREE.PerspectiveCamera(45,1,0.05,100);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
controls.minDistance=0.1; controls.maxDistance=12;
const ANISO=renderer.capabilities.getMaxAnisotropy();

/* ---------- procedural tiles ---------- */
const T=128;
const C={cobalt:'#1f3c94',cobalt2:'#2a4fb0',navy:'#16285f',white:'#f8f6f1',cream:'#f1ead9',lemon:'#f2c230',leaf:'#3f8a4a',turq:'#2aa3a8',orange:'#ef8a2b'};
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function base(ctx,x,y,s,col){ctx.fillStyle=col;ctx.fillRect(x,y,s,s);}
function shade(ctx,x,y,s,r){const g=ctx.createRadialGradient(x+s*r(),y+s*r(),s*.1,x+s/2,y+s/2,s*.85);
  g.addColorStop(0,'rgba(255,255,255,0.12)');g.addColorStop(1,'rgba(0,0,0,0.10)');ctx.fillStyle=g;ctx.fillRect(x,y,s,s);}
function streaks(ctx,x,y,s,r,rgb){ctx.lineWidth=s*0.035;for(let i=0;i<7;i++){ctx.strokeStyle=`rgba(${rgb},${0.12+r()*0.16})`;ctx.beginPath();
  const yy=y+(i+0.5)*s/7,ph=r()*6;for(let k=0;k<=12;k++){const xx=x+k*s/12,w=Math.sin(k*1.3+ph)*s*0.02;k?ctx.lineTo(xx,yy+w):ctx.moveTo(xx,yy+w);}ctx.stroke();}}
function pCobalt(ctx,x,y,s,r){base(ctx,x,y,s,['#1d3a93','#203f9c','#1a3586','#24459f'][Math.floor(r()*4)]);streaks(ctx,x,y,s,r,'150,180,255');shade(ctx,x,y,s,r);}
function pTurq(ctx,x,y,s,r){base(ctx,x,y,s,['#2aa3a8','#2696a0','#32adb0'][Math.floor(r()*3)]);streaks(ctx,x,y,s,r,'210,250,250');shade(ctx,x,y,s,r);}
function pCream(ctx,x,y,s,r){base(ctx,x,y,s,r()<.5?'#f1ead9':'#ece3cf');shade(ctx,x,y,s,r);}
function pWave(ctx,x,y,s,r){base(ctx,x,y,s,'#172d74');ctx.lineWidth=1.6;ctx.strokeStyle='rgba(255,255,255,0.42)';
  for(let k=0;k<6;k++){ctx.beginPath();const x0=x+(k+0.5)*s/6;for(let j=0;j<=16;j++){const yy=y+j*s/16,xx=x0+Math.sin(j*0.9+k)*s*0.03;j?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();}shade(ctx,x,y,s,r);}
function fish(ctx,cx,cy,len,ang){ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.fillStyle='#7f9fd6';ctx.strokeStyle=C.navy;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.ellipse(0,0,len*.5,len*.14,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-len*.45,0);ctx.lineTo(-len*.7,-len*.14);ctx.lineTo(-len*.7,len*.14);ctx.closePath();ctx.fill();ctx.stroke();

// materials legend for the tiles: the shower choice plus the WC-wall choice, merging entries for the same tile
function tileLegend(){
  const navyV=crop(cvNavyV,0,0,256,256),whiteV=crop(cvWhiteV,0,0,256,256),mai=crop(cvMaiolica,0,0,256,256),ter=crop(cvTerrazzo,0,0,512,512),
    mos=crop(cvMosaic,0,0,256,256),chk=crop(cvWains,0,128,256,256),pat=crop(cvPatch,0,0,256,256);
  const arch='An 8 cm deep arched niche around the veranda window, lined in maiolica, with brass hooks for shower products.';
  const archE=frame=>AF==='terrazzo'?[ter,'Terrazzo with blue chips, 40 × 40','Arch: the 8 cm deep arched niche around the veranda window, lined in terrazzo'+(frame?' and framed by the '+frame:'')+', with a cream pencil trim and brass hooks for shower products.']:[mai,'Blue and white maiolica niche',frame?arch.replace('lined in maiolica,','lined in maiolica and framed by the '+frame+','):arch];
  const S={
    navy:[[navyV,'Dark blue glazed 7.5 × 30, vertical','Shower: floor to ceiling on every wall, the seat including its top and the product niche including its sill, framing the arch.'],archE('navy tile')],
    maiolica:[[whiteV,'White glazed 7.5 × 30, vertical','Shower: floor to ceiling on the three plain walls, the seat including its top and the product niche on all sides.'],
      [mai,'Blue and white maiolica feature wall','The whole long wall of the shower, floor to ceiling. The veranda window sits in a plain 8 cm reveal lined in maiolica, with a cream pencil trim and a marble sill; no arch.']],
    terrazzo:[[ter,'Terrazzo with blue chips, 40 × 40','Shower: floor to ceiling on every wall, the veranda window in a plain square reveal (no arch) with a terrazzo sill, the seat including its top and the product niche on all sides. Off-white, flecked with cobalt, navy and sky blue, honed and sealed.']],
    mosaic:[[mos,'Blue and white mosaic, 2.5 × 2.5','Shower: floor to ceiling on every wall, the seat including its top and the product niche including its sill, in a random mix of white, pale blue, mid blue, cobalt and a little navy.'],archE('mosaic')],
  }[SH];
  const W={
    checker:[[chk,'Cream and blue checkerboard','Wainscot to 120 cm, mixing cream, cobalt and the wavy navy tile from the History 15 × 15 samples: with a hand-painted top row on the vanity side, plain to the top on the WC/bidet wall.'],
      [pat,'Hand-painted Vietri-style tiles','The backsplash under the mirror and the border row along the top of the wainscot on the vanity side.']],
    white:[[whiteV,'White glazed 7.5 × 30, vertical','WC/bidet wall up to 120 cm in four full rows, and the wainscot to 105 cm on the vanity side.'],
      [pat,'Hand-painted Vietri-style tiles','The backsplash under the mirror and a 15 cm band capping the wainscot at 105 to 120 cm on the vanity side.']],
    none:[[chk,'Cream and blue checkerboard','Wainscot to 120 cm on the vanity side, with the hand-painted row on top. The WC/bidet wall has no tiles: it is painted like the walls above, in a washable finish.'],
      [pat,'Hand-painted Vietri-style tiles','The backsplash under the mirror and the border row along the top of the wainscot on the vanity side.']],
    terrazzo:[[ter,'Terrazzo with blue chips, 40 × 40','WC/bidet wall up to 120 cm in three full rows, carried along the window side.'],
      [chk,'Cream and blue checkerboard','Wainscot to 120 cm on the vanity side, with the hand-painted row on top.'],
      [pat,'Hand-painted Vietri-style tiles','The backsplash under the mirror and the border row along the top of the wainscot on the vanity side.']],
  }[WT];
  const out=[];[...S,...W].forEach(e=>{const f=out.find(o=>o[1]===e[1]);if(f){if(!f[2].includes(e[2]))f[2]+=' '+e[2];}else out.push([...e]);});
  return out;}
function renderLegend(NB){
const mats=[
...tileLegend(),
  [crop(limewashCanvas('pure'),0,0,512,512),'Warm white',`Walls above the 120 cm tile line and the ceiling${ceilMode==='navy'?' outside the shower (the shower ceiling is painted deep navy in a moisture-resistant matt finish)':''}, in a pure, soft warm white with only the faintest brushed texture.`],
  [(()=>{const c=cv(96,96),x=c.getContext('2d');x.fillStyle='#efe3cf';x.fillRect(0,0,96,96);const g=x.createRadialGradient(48,52,4,48,52,30);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#f3e6cc');x.fillStyle=g;x.beginPath();x.arc(48,52,26,0,7);x.fill();return c;})(),'Ceiling lighting',`Recessed downlights on two lines: two IP65 in the shower, ${NB?'one over the WC':'one each over the WC and the bidet'}, on the middle of the room width; the basin is lit by the backlit mirror and the wall lights. All flush with the ceiling, warm 2700 K, on dimmers.`],
  [crop(cvFloor,560,40,240,240),'Large pale beige floor tiles','60 × 120 cm, one uniform pale beige, laid in a straight grid with all joints aligned, one joint under the shower glass, across the whole floor, shower included, falling to a linear drain along the front of the shower seat.'],
];
document.getElementById('mats').innerHTML=mats.map(([src,t,d])=>`<div class="mat"><img src="${src}" alt=""><div><b>${t}</b><span>${d}</span></div></div>`).join('')+
  `<div class="mat"><img src="${(()=>{const c=cv(96,96),x=c.getContext('2d');x.fillStyle='#b8893d';x.fillRect(0,0,96,48);x.fillStyle='#f2c230';x.fillRect(0,48,48,48);x.fillStyle='#2aa3a8';x.fillRect(48,48,48,48);return c.toDataURL();})()}" alt=""><div><b>${VCOLS[VCOL].title}</b><span>${NB?'A wider 120 cm '+VCOLS[VCOL].adj+' shaker vanity with a white stone top and a 60 cm undermount basin, a 66 cm arched backlit mirror with a fine brass edge, a single brass towel hook beside it at mid-mirror height and a double socket on the return wall, and '+(NCOL==='oak'?'an ':'a ')+NICHE_NAMES[NCOL]+' niche above the WC.':''+VCOLS[VCOL].Adj+' shaker vanity with a white stone top and undermount basin, an arched backlit mirror with a fine brass edge, and '+NICHE_NAMES[NCOL]+' niches above the WC and bidet.'}</span></div></div>`;
}
setLayout(location.hash==='#senza-bidet'?'nobidet':'bidet');
if(window.innerWidth>1100)document.getElementById('legend').open=true;
})();
</script>
</body>
</html>
